name: Environment Controller

on:
  # ─── Manual trigger ───────────────────────────────────────────────────────
  workflow_dispatch:
    inputs:
      action:
        description: "Action"
        required: true
        type: choice
        options:
          - start
          - stop
      environment:
        description: "Target Environment"
        required: true
        type: choice
        options:
          - dev
          - uat
          - all

  # ─── Automatic schedule (Mon–Fri only) ────────────────────────────────────
  schedule:
    - cron: '30 2 * * 1-5'   # 08:00 AM IST  →  START
    - cron: '30 17 * * 1-5'  # 11:00 PM IST  →  STOP

# ─────────────────────────────────────────────────────────────────────────────
# GitHub Variables  (Settings → Variables → Actions)
#
#   DEV_ROLE_ARN  →  arn:aws:iam::<DEV_ACCOUNT_ID>:role/GitHubActionsEnvControlRole
#   UAT_ROLE_ARN  →  arn:aws:iam::<UAT_ACCOUNT_ID>:role/GitHubActionsEnvControlRole
#
# ─────────────────────────────────────────────────────────────────────────────

jobs:

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 1 — Resolve what to run (shared by both env jobs below)
  # ══════════════════════════════════════════════════════════════════════════
  resolve:
    name: Resolve Action + Environment
    runs-on: ubuntu-latest
    outputs:
      action:  ${{ steps.vars.outputs.action }}
      run_dev: ${{ steps.vars.outputs.run_dev }}
      run_uat: ${{ steps.vars.outputs.run_uat }}

    steps:
      - name: Resolve Variables
        id: vars
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ACTION="${{ github.event.inputs.action }}"
            ENV="${{ github.event.inputs.environment }}"
          else
            HOUR=$(date -u +"%H")
            ACTION=$( [ "$HOUR" == "02" ] && echo "start" || echo "stop" )
            ENV="all"
          fi

          RUN_DEV=$( [ "$ENV" == "dev" ] || [ "$ENV" == "all" ] && echo "true" || echo "false" )
          RUN_UAT=$( [ "$ENV" == "uat" ] || [ "$ENV" == "all" ] && echo "true" || echo "false" )

          echo "action=$ACTION"   >> "$GITHUB_OUTPUT"
          echo "run_dev=$RUN_DEV" >> "$GITHUB_OUTPUT"
          echo "run_uat=$RUN_UAT" >> "$GITHUB_OUTPUT"

          echo "──────────────────────────────────"
          echo "  ACTION  : $ACTION"
          echo "  RUN_DEV : $RUN_DEV"
          echo "  RUN_UAT : $RUN_UAT"
          echo "──────────────────────────────────"

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 2 — DEV  (EC2 + RDS)
  #
  #   continue-on-error: true  →  a DEV failure NEVER blocks UAT
  # ══════════════════════════════════════════════════════════════════════════
  manage-dev:
    name: Manage DEV Environment
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.run_dev == 'true'

    # ── KEY: DEV failure must NOT block UAT ───────────────────────────────
    continue-on-error: true

    permissions:
      id-token: write
      contents: read

    env:
      ACTION: ${{ needs.resolve.outputs.action }}

    steps:

      # ── Login ────────────────────────────────────────────────────────────
      - name: Configure DEV AWS Credentials
        id: dev_login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.DEV_ROLE_ARN }}
          aws-region: ap-south-1

      # ── DEV EC2 ──────────────────────────────────────────────────────────
      - name: Manage DEV EC2
        id: dev_ec2
        run: |
          echo "::group::DEV EC2 — $ACTION"

          EC2_IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Environment,Values=dev" \
              "Name=tag:AutoSchedule,Values=true" \
              "Name=instance-state-name,Values=running,stopped" \
            --query 'Reservations[*].Instances[*].InstanceId' \
            --output text)

          if [ -z "$EC2_IDS" ]; then
            echo "⚠️  No DEV EC2 instances tagged AutoSchedule=true — nothing to do."
            echo "::endgroup::"
            exit 0
          fi

          echo "Instances found: $EC2_IDS"

          if [ "$ACTION" == "stop" ]; then
            aws ec2 stop-instances  --instance-ids $EC2_IDS
            echo "✅ DEV EC2 STOP issued."
          else
            aws ec2 start-instances --instance-ids $EC2_IDS
            echo "✅ DEV EC2 START issued."
          fi

          echo "::endgroup::"

      # ── DEV RDS ──────────────────────────────────────────────────────────
      - name: Manage DEV RDS
        id: dev_rds
        run: |
          echo "::group::DEV RDS — $ACTION"

          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)

          ALL_DBS=$(aws rds describe-db-instances \
            --query 'DBInstances[*].DBInstanceIdentifier' \
            --output text)

          if [ -z "$ALL_DBS" ]; then
            echo "⚠️  No RDS instances found in DEV account — nothing to do."
            echo "::endgroup::"
            exit 0
          fi

          MANAGED=0

          for DB in $ALL_DBS; do

            TAG_CHECK=$(aws rds list-tags-for-resource \
              --resource-name "arn:aws:rds:ap-south-1:${ACCOUNT_ID}:db:${DB}" \
              --query "TagList[?Key=='AutoSchedule' && Value=='true']" \
              --output text)

            if [ -n "$TAG_CHECK" ]; then
              echo "Managing: $DB"
              if [ "$ACTION" == "stop" ]; then
                aws rds stop-db-instance  --db-instance-identifier "$DB" \
                  && echo "  ✅ STOP issued for $DB" \
                  || echo "  ❌ STOP failed for $DB (may already be stopped)"
              else
                aws rds start-db-instance --db-instance-identifier "$DB" \
                  && echo "  ✅ START issued for $DB" \
                  || echo "  ❌ START failed for $DB (may already be running)"
              fi
              MANAGED=$((MANAGED + 1))
            else
              echo "Skipping $DB — AutoSchedule tag not set."
            fi

          done

          if [ "$MANAGED" -eq 0 ]; then
            echo "⚠️  No RDS instances tagged AutoSchedule=true — nothing to do."
          fi

          echo "::endgroup::"

      # ── DEV Summary ───────────────────────────────────────────────────────
      - name: DEV Result Summary
        if: always()
        run: |
          echo "──────────────────────────────────────────"
          echo "  DEV JOB SUMMARY"
          echo "  Login  : ${{ steps.dev_login.outcome }}"
          echo "  EC2    : ${{ steps.dev_ec2.outcome }}"
          echo "  RDS    : ${{ steps.dev_rds.outcome }}"
          echo "──────────────────────────────────────────"

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 3 — UAT  (EC2 only — RDS intentionally excluded)
  #
  #   needs: [resolve]  →  does NOT depend on manage-dev at all
  #   UAT runs in parallel with DEV and is NEVER blocked by DEV failures.
  # ══════════════════════════════════════════════════════════════════════════
  manage-uat:
    name: Manage UAT Environment
    runs-on: ubuntu-latest
    needs: resolve
    if: needs.resolve.outputs.run_uat == 'true'

    permissions:
      id-token: write
      contents: read

    env:
      ACTION: ${{ needs.resolve.outputs.action }}

    steps:

      # ── Login ────────────────────────────────────────────────────────────
      - name: Configure UAT AWS Credentials
        id: uat_login
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.UAT_ROLE_ARN }}
          aws-region: ap-south-1

      # ── UAT EC2 ──────────────────────────────────────────────────────────
      - name: Manage UAT EC2
        id: uat_ec2
        run: |
          echo "::group::UAT EC2 — $ACTION"

          EC2_IDS=$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Environment,Values=uat" \
              "Name=tag:AutoSchedule,Values=true" \
              "Name=instance-state-name,Values=running,stopped" \
            --query 'Reservations[*].Instances[*].InstanceId' \
            --output text)

          if [ -z "$EC2_IDS" ]; then
            echo "⚠️  No UAT EC2 instances tagged AutoSchedule=true — nothing to do."
            echo "::endgroup::"
            exit 0
          fi

          echo "Instances found: $EC2_IDS"

          if [ "$ACTION" == "stop" ]; then
            aws ec2 stop-instances  --instance-ids $EC2_IDS
            echo "✅ UAT EC2 STOP issued."
          else
            aws ec2 start-instances --instance-ids $EC2_IDS
            echo "✅ UAT EC2 START issued."
          fi

          echo "::endgroup::"

      # ── UAT Summary ───────────────────────────────────────────────────────
      - name: UAT Result Summary
        if: always()
        run: |
          echo "──────────────────────────────────────────"
          echo "  UAT JOB SUMMARY"
          echo "  Login  : ${{ steps.uat_login.outcome }}"
          echo "  EC2    : ${{ steps.uat_ec2.outcome }}"
          echo "──────────────────────────────────────────"

  # ══════════════════════════════════════════════════════════════════════════
  # JOB 4 — Final Status Report
  # Always runs last, even if DEV or UAT failed — gives you one clear result.
  # ══════════════════════════════════════════════════════════════════════════
  final-status:
    name: Final Status Report
    runs-on: ubuntu-latest
    needs: [resolve, manage-dev, manage-uat]
    if: always()

    steps:
      - name: Print Final Status
        run: |
          echo "════════════════════════════════════════════"
          echo "  ENVIRONMENT CONTROLLER — FINAL REPORT"
          echo "  Action  : ${{ needs.resolve.outputs.action }}"
          echo "════════════════════════════════════════════"
          echo "  DEV job : ${{ needs.manage-dev.result }}"
          echo "  UAT job : ${{ needs.manage-uat.result }}"
          echo "════════════════════════════════════════════"

          DEV_RESULT="${{ needs.manage-dev.result }}"
          UAT_RESULT="${{ needs.manage-uat.result }}"

          # 'skipped' means the env was not selected — treat as OK
          FAILED=false
          [ "$DEV_RESULT" == "failure" ] && FAILED=true
          [ "$UAT_RESULT" == "failure" ] && FAILED=true

          if [ "$FAILED" == "true" ]; then
            echo ""
            echo "❌ One or more environments reported a failure."
            echo "   Check the individual job logs above for details."
            exit 1
          else
            echo ""
            echo "✅ All selected environments completed successfully."
          fi
