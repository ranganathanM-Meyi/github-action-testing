name: Environment Controller (Start/Stop)

on:
  # 1. THE MANUAL OVERRIDE (For Developers)
  # This block creates the visual UI in GitHub Actions
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform (start or stop)'
        required: true
        type: choice
        options: 
          - start
          - stop
      environment:
        description: 'Target Environment'
        required: true
        type: choice
        options: 
          - dev
          - uat

  # 2. THE AUTOMATED SCHEDULE
  # Runs automatically based on UTC time (e.g. 8 AM and 8 PM IST)
  schedule:
    - cron: '30 2 * * 1-5'  
    - cron: '30 14 * * 1-5' 

jobs:
  manage-environment:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. SECURE AUTHENTICATION
      # The GitHub Runner logs into AWS using OIDC (No passwords required)
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::YOUR_AWS_ACCOUNT_ID:role/GitHubActionsEnvControlRole
          aws-region: ap-south-1

      # 4. EXECUTION SCRIPT
      - name: Execute Start/Stop Logic
        run: |
          # Determine if this was run manually by a developer or automatically by the cron schedule
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ACTION="${{ github.event.inputs.action }}"
            ENV="${{ github.event.inputs.environment }}"
          else
            # Logic to handle automated cron triggers
            ENV="dev"
            HOUR=$(date -u +"%H")
            if [ "$HOUR" -lt "10" ]; then ACTION="start"; else ACTION="stop"; fi
          fi
          
          echo "Executing $ACTION on $ENV environment..."
          
          # Example AWS CLI Command to find and stop EC2 instances dynamically:
          INSTANCE_IDS=$(aws ec2 describe-instances --filters "Name=tag:Environment,Values=$ENV" "Name=tag:AutoSchedule,Values=true" --query 'Reservations[*].Instances[*].InstanceId' --output text)
          
          if [ "$ACTION" == "stop" ]; then
             aws ec2 stop-instances --instance-ids $INSTANCE_IDS
          elif [ "$ACTION" == "start" ]; then
             aws ec2 start-instances --instance-ids $INSTANCE_IDS
          fi
          
          # (Similar AWS CLI commands are added here for RDS instances and ASG capacity adjustments)
