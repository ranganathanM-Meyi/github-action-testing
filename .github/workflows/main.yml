
name: ACMOLOGY Builder Webhook - Testing

run-name: ACMOLOGY DEV Webhook Test - ${{ inputs.deployment_command || 'Push Trigger' }}

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deployment_command:
        description: "Deployment command received from AWS Lambda"
        required: true
        type: choice
        options:
          - deploy-dev

env:
  TEST_ENVIRONMENT: DEV
  TEST_BRANCH: main

jobs:
  webhook-test:
    name: Test Builder Webhook Trigger
    runs-on: ubuntu-latest

    steps:
      # ------------------------------------------
      # 1. Checkout Repository
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # 2. Display Workflow Information
      # ------------------------------------------

      - name: Display workflow information
        env:
          DEPLOYMENT_COMMAND: ${{ inputs.deployment_command }}
        run: |
          echo "=================================="
          echo " ACMOLOGY WEBHOOK TEST"
          echo "=================================="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Triggered by: $GITHUB_EVENT_NAME"
          echo "Environment: $TEST_ENVIRONMENT"
          echo "Deployment command: ${DEPLOYMENT_COMMAND:-Not provided}"
          echo "=================================="

      # ------------------------------------------
      # 3. Verify Workflow Trigger
      # ------------------------------------------

      - name: Verify workflow trigger
        env:
          DEPLOYMENT_COMMAND: ${{ inputs.deployment_command }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "Workflow triggered through API or manual dispatch."

            if [ "$DEPLOYMENT_COMMAND" != "deploy-dev" ]; then
              echo "ERROR: Invalid deployment command."
              exit 1
            fi

            echo "SUCCESS: Deployment command validated."

          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
            echo "SUCCESS: Workflow triggered through Git push."

          else
            echo "Unexpected event: $GITHUB_EVENT_NAME"
            exit 1
          fi

      # ------------------------------------------
      # 4. Simulate Deployment
      # ------------------------------------------

      - name: Simulate deployment
        env:
          DEPLOYMENT_COMMAND: ${{ inputs.deployment_command }}
        run: |
          echo "=================================="
          echo " STARTING TEST DEPLOYMENT"
          echo "=================================="
          echo "Environment: $TEST_ENVIRONMENT"
          echo "Target branch: $TEST_BRANCH"
          echo "Deployment command: ${DEPLOYMENT_COMMAND:-Push Trigger}"
          echo ""
          echo "No actual AWS deployment will happen."
          echo "Test deployment completed successfully."

      # ------------------------------------------
      # 5. Final Status
      # ------------------------------------------

      - name: Final status
        run: |
          echo "=================================="
          echo " WEBHOOK TEST COMPLETED"
          echo "=================================="
          echo "Environment: $TEST_ENVIRONMENT"
          echo "Workflow status: SUCCESS"
