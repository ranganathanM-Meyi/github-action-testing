
name: ACMOLOGY Builder Webhook - Testing

run-name: ACMOLOGY Builder Deployment - ${{ inputs.deployment_command || 'Push Trigger' }}

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      deployment_command:
        description: "Deployment command received from Builder.io"
        required: true
        type: string

env:
  TEST_ENVIRONMENT: DEV
  TEST_BRANCH: main

jobs:
  webhook-test:
    name: Test Builder Webhook Trigger
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------
      # 1. Checkout Repository
      # ------------------------------------------

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------
      # 2. Display Workflow Information
      # ------------------------------------------

      - name: Display workflow information
        env:
          DEPLOYMENT_COMMAND: ${{ inputs.deployment_command }}
        run: |
          echo "=================================="
          echo " ACMOLOGY WEBHOOK TEST"
          echo "=================================="
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Triggered by: $GITHUB_EVENT_NAME"
          echo "Environment: $TEST_ENVIRONMENT"
          echo "Deployment command: ${DEPLOYMENT_COMMAND:-Not provided}"
          echo "=================================="

      # ------------------------------------------
      # 3. Validate Workflow Input
      # ------------------------------------------

      - name: Validate deployment command
        env:
          DEPLOYMENT_COMMAND: ${{ inputs.deployment_command }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then

            if [ -z "$DEPLOYMENT_COMMAND" ]; then
              echo "ERROR: Deployment command is missing."
              exit 1
            fi

            if [ ${#DEPLOYMENT_COMMAND} -gt 200 ]; then
              echo "ERROR: Deployment command is too long."
              exit 1
            fi

            if [[ ! "$DEPLOYMENT_COMMAND" =~ ^[A-Za-z0-9._:/\ -]+$ ]]; then
              echo "ERROR: Deployment command contains invalid characters."
              exit 1
            fi

            echo "SUCCESS: Deployment command received and validated."

          elif [ "$GITHUB_EVENT_NAME" = "push" ]; then

            echo "Workflow triggered through Git push."
            echo "No deployment command was provided."

          else

            echo "Unexpected event: $GITHUB_EVENT_NAME"
            exit 1

          fi

      # ------------------------------------------
      # 4. Simulate Deployment
      # ------------------------------------------

      - name: Simulate deployment
        env:
          DEPLOYMENT_COMMAND: ${{ inputs.deployment_command }}
        run: |
          echo "=================================="
          echo " STARTING TEST DEPLOYMENT"
          echo "=================================="
          echo "Environment: $TEST_ENVIRONMENT"
          echo "Target branch: $TEST_BRANCH"
          echo "Deployment command: ${DEPLOYMENT_COMMAND:-Push Trigger}"
          echo ""
          echo "No actual AWS deployment will happen."
          echo "Test deployment completed successfully."

      # ------------------------------------------
      # 5. Final Status
      # ------------------------------------------

      - name: Final status
        env:
          DEPLOYMENT_COMMAND: ${{ inputs.deployment_command }}
        run: |
          echo "=================================="
          echo " WEBHOOK TEST COMPLETED"
          echo "=================================="
          echo "Environment: $TEST_ENVIRONMENT"
          echo "Deployment command: ${DEPLOYMENT_COMMAND:-Push Trigger}"
          echo "Workflow status: SUCCESS"
          echo "=================================="
